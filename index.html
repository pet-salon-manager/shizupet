<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const SUPABASE_URL='https://abofyfovxysqzchstnbx.supabase.co';const SUPABASE_KEY='sb_publishable_pslo3qPFj50r2AQx_zx0ew_ywzBdxIj';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let spots=[],map,layer,currentMarker,currentPos,isAdmin=false,activeType='すべて',recommendedOnly=false;const types=['すべて','動物病院','トリミング','ペット用品','ドッグラン','ペット同伴','宿泊','その他'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safeUrl(u){try{let x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch{return '#'}}function openModal(id){

function initMap(){if(map||!window.L)return;map=L.map('map').setView([34.98,138.38],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map);setTimeout(()=>map.invalidateSize(),200)}
const SHIZUOKA_CITY_CENTERS={
'静岡市':[34.9756,138.3828],'静岡市葵区':[34.9756,138.3828],'静岡市駿河区':[34.9608,138.4045],'静岡市清水区':[35.0158,138.4897],
'浜松市':[34.7108,137.7261],'浜松市中央区':[34.7108,137.7261],'沼津市':[35.0956,138.8635],'三島市':[35.1184,138.9186],

'島田市':[34.8362,138.1760],'掛川市':[34.7687,138.0148],'袋井市':[34.7500,137.9247],'磐田市':[34.7179,137.8515],
'御前崎市':[34.6378,138.1281],'牧之原市':[34.7400,138.2247],'菊川市':[34.7576,138.0846],'熱海市':[35.0959,139.0716],
'伊東市':[34.9657,139.1019],'伊豆市':[34.9765,138.9468],'伊豆の国市':[35.0278,138.9286],'下田市':[34.6795,138.9453],
'御殿場市':[35.3086,138.9345],'裾野市':[35.1739,138.9067],'湖西市':[34.7186,137.5317],'長泉町':[35.1378,138.8972],
'清水町':[35.0994,138.9028],'函南町':[35.0880,138.9533],'小山町':[35.3605,138.9874],'吉田町':[34.7706,138.2518],
'森町':[34.8355,137.9271],'東伊豆町':[34.7728,139.0413],'河津町':[34.7570,138.9876],'南伊豆町':[34.6511,138.8583],
'松崎町':[34.7530,138.7788],'西伊豆町':[34.7718,138.7751]
};

function fallbackCityPosition(city){
  const c=String(city||'').trim();
  if(!c)return null;
  if(SHIZUOKA_CITY_CENTERS[c])return SHIZUOKA_CITY_CENTERS[c];
  const key=Object.keys(SHIZUOKA_CITY_CENTERS).find(k=>c.includes(k)||k.includes(c));
  return key?SHIZUOKA_CITY_CENTERS[key]:null;
}

async function geocodeAddress(address,city){
  const query=[address,city,'静岡県','日本'].filter(Boolean).join(' ');
  if(!query.trim())return null;
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),7000);
    const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q='+encodeURIComponent(query);
    const res=await fetch(url,{signal:controller.signal,headers:{'Accept':'application/json','Accept-Language':'ja'}});
    clearTimeout(timer);
    if(!res.ok)return null;
    const rows=await res.json();
    if(!rows?.length)return null;
    const lat=Number(rows[0].lat),lng=Number(rows[0].lon);
    return Number.isFinite(lat)&&Number.isFinite(lng)?[lat,lng]:null;
  }catch(e){
    console.warn('住所検索失敗',e);
    return null;
  }
}

async function fillCoordinatesFromAddress(){
  const address=document.getElementById('facilityAddress').value.trim();
  const city=document.getElementById('facilityCity').value.trim();
  const status=document.getElementById('geocodeStatus');
  if(!address && !city){status.textContent='住所または市町を入力してください';return null;}
  status.textContent='地図位置を取得中…';
  let pos=await geocodeAddress(address,city);
  if(!pos){
    pos=fallbackCityPosition(city);
    if(pos)status.textContent='市町の概略位置を設定しました';
  }else{
    status.textContent='住所から地図位置を取得しました';
  }
  if(!pos){status.textContent='地図位置を取得できませんでした';return null;}
  document.getElementById('facilityLat').value=pos[0].toFixed(6);
  document.getElementById('facilityLng').value=pos[1].toFixed(6);
  return pos;
}

function getPos(s){
  const lat=Number(s?.lat),lng=Number(s?.lng);
  if(Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180){
    return [lat,lng];
  }
  return fallbackCityPosition(s?.city);
}function renderMap(){if(!map||!layer)return;layer.clearLayers();filtered().forEach(s=>{let p=getPos(s);if(!p)return;let m=L.marker(p).addTo(layer);m.bindPopup(`<strong>${esc(s.name)}</strong><br>${esc(s.city||'静岡県')}・${esc(s.type)}<br><button onclick="routeTo('${s.id}')">現在地から行く</button>`)})}
function locateMe(silent=false){if(!navigator.geolocation){if(!silent)alert('現在地を取得できません');return}navigator.geolocation.getCurrentPosition(pos=>{currentPos=[pos.coords.latitude,pos.coords.longitude];if(currentMarker)currentMarker.remove();let icon=L.divIcon({className:'',html:'<div class="currentDot"></div>',iconSize:[18,18],iconAnchor:[9,9]});currentMarker=L.marker(currentPos,{icon}).addTo(map).bindPopup('現在地');map.setView(currentPos,12);renderSpots()},()=>{if(!silent)alert('位置情報を許可してください')},{enableHighAccuracy:true,timeout:8000,maximumAge:120000})}
function distanceKm(a,b){if(!a||!b)return null;let R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b[0]-a[0]),dLon=toRad(b[1]-a[1]),x=Math.sin(dLat/2)**2+Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function toggleRecommendedFilter(){
  recommendedOnly=!recommendedOnly;
  const btn=document.getElementById('recommendedFilterBtn');
  if(btn){
    btn.classList.toggle('active',recommendedOnly);
    btn.textContent=recommendedOnly
      ? '✓ おすすめ店舗を表示中（解除）'
      : '⭐ おすすめ店舗だけ表示';
  }
  renderSpots();
}


function socialSearchQuery(){
  const q=(document.getElementById('search')?.value||'').trim();
  return ['静岡','ペット',q].filter(Boolean).join(' ');
}

function openFacebookSearch(){
  const q=encodeURIComponent(socialSearchQuery());
  window.open(`https://www.facebook.com/search/top?q=${q}`,'_blank','noopener');
}

function openXSearch(){
  const q=encodeURIComponent(socialSearchQuery());
  window.open(`https://x.com/search?q=${q}&src=typed_query&f=live`,'_blank','noopener');
}

function openYouTubeSearch(){
  const q=encodeURIComponent(socialSearchQuery());

}

function filtered(){
  let q=(search.value||'').toLowerCase();
  let xs=spots.filter(s =>
    (!recommendedOnly || s.recommended===true) &&
    (activeType==='すべて' || s.type===activeType) &&
    (`${s.name} ${s.city||''} ${s.type||''} ${s.address||''}`.toLowerCase().includes(q))
  );

  xs=xs.map(s=>({...s,_d:currentPos?distanceKm(currentPos,getPos(s)):null}));

  // おすすめを上位、その中では現在地に近い順
  xs.sort((a,b)=>
    Number(!!b.recommended)-Number(!!a.recommended) ||
    ((a._d??9999)-(b._d??9999)) ||
    String(a.name||'').localeCompare(String(b.name||''),'ja')
  );

  return xs;
}function setupFilters(){typeFilters.innerHTML=types.map(t=>`<button class="${activeType===t?'active':''}" onclick="activeType='${t}';setupFilters();renderSpots()">${t}</button>`).join('')}
function renderSpots(){let xs=filtered();count.textContent=`${xs.length}件`;spotList.innerHTML=xs.length?xs.map(s=>`<div class="card spot ${s.recommended?'recoCard':''}"><div class="spotTop"><div class="icon">${iconFor(s.type)}</div><div style="flex:1">${s.recommended?'<span class="recoBadge">⭐ おすすめ</span>':''}<h3>${esc(s.name)}</h3><div class="muted">${esc(s.city||'静岡県')} ｜ ${esc(s.type)}</div>${s.address?`<div class="tag">📍 ${esc(s.address)}</div>`:''}${s._d!=null?`<div class="tag">現在地から直線距離 約${s._d.toFixed(s._d<10?1:0)}km</div>`:''}<div class="actions">${s.url?`<button onclick="window.open('${safeUrl(s.url)}','_blank')">🌐 公式HP</button>`:''}${s.phone?`<button onclick="location.href='tel:${esc(s.phone)}'">☎️ 電話</button>`:''}<button class="primary" onclick="routeTo('${s.id}')">🧭 経路</button>${isAdmin?`<button class="recommend" onclick="toggleRecommended('${s.id}')">${s.recommended?'⭐ おすすめ解除':'☆ おすすめ指定'}</button><button onclick="editFacility('${s.id}')">✏️ 編集</button><button class="danger" onclick="deleteFacility('${s.id}')">削除</button>`:''}</div></div></div></div>`).join(''):'<div class="card empty">条件に合う施設がありません</div>';renderMap()}
async function loadFacilities(){
  let {data,error}=await sb.from('facilities').select('*').order('name');
  if(error){
    console.error(error);
    count.textContent='0件';
    spotList.innerHTML='<div class="card empty">施設情報を読み込めませんでした</div>';
    return
  }
  spots=(data||[]).filter(s=>s.is_active!==false);
  renderSpots()
}function routeTo(id){let s=spots.find(x=>String(x.id)===String(id));if(!s)return;let p=getPos(s),destination=s.address?encodeURIComponent(s.address):(p?`${p[0]},${p[1]}`:'');if(!destination)return alert('位置情報がありません');let open=o=>location.href=`https://maps.apple.com/?saddr=${o[0]},${o[1]}&daddr=${destination}&dirflg=d`;if(currentPos)open(currentPos);else navigator.geolocation.getCurrentPosition(pos=>open([pos.coords.latitude,pos.coords.longitude]),()=>alert('現在地を取得できません'))}
function adminTopAction(){
  if(isAdmin){newFacility();}else{openAdmin();}

async function openAdmin(){if(isAdmin){if(confirm('ログアウトしますか？')){await sb.auth.signOut();isAdmin=false;refreshAdmin();renderSpots()}return}openModal('adminModal')}async function adminLogin(e){e.preventDefault();let {data,error}=await sb.auth.signInWithPassword({email:adminEmail.value,password:adminPassword.value});if(error)return alert('ログインできませんでした');let {data:ok}=await sb.rpc('is_app_admin');isAdmin=!!ok;if(!isAdmin){await sb.auth.signOut();return alert('管理者権限がありません')}closeModal('adminModal');refreshAdmin();renderSpots()}function refreshAdmin(){

async function toggleRecommended(id){
  if(!isAdmin)return;
  let s=spots.find(x=>String(x.id)===String(id));if(!s)return;
  let {error}=await sb.from('facilities').update({recommended:!s.recommended}).eq('id',id);

}

function editFacility(id){
  if(!isAdmin){openAdmin();return;}
  const s=spots.find(x=>String(x.id)===String(id));
  if(!s){alert('施設情報を取得できませんでした');return;}
  const byId=(id)=>document.getElementById(id);
  byId('facilityTitle').textContent='施設情報を編集';
  byId('facilityId').value=s.id??'';
  byId('facilityName').value=s.name||'';
  byId('facilityArea').value=s.area||'東部';
  byId('facilityCity').value=s.city||'';
  byId('facilityAddress').value=s.address||'';
  byId('facilityType').value=s.type||'その他';
  byId('facilityUrl').value=s.url||'';
  byId('facilityPhone').value=s.phone||'';
  byId('facilityLat').value=s.lat??'';
  byId('facilityLng').value=s.lng??'';
  byId('facilityRecommended').checked=!!s.recommended;
  const gs=document.getElementById('geocodeStatus');if(gs)gs.textContent='';
  openModal('facilityModal');
}
async function saveFacility(e){
  e.preventDefault();
  if(!isAdmin){alert('管理者ログインが必要です');return}

  const facilityId=document.getElementById('facilityId');
  const facilityName=document.getElementById('facilityName');
  const facilityArea=document.getElementById('facilityArea');
  const facilityCity=document.getElementById('facilityCity');
  const facilityAddress=document.getElementById('facilityAddress');
  const facilityType=document.getElementById('facilityType');
  const facilityUrl=document.getElementById('facilityUrl');
  const facilityPhone=document.getElementById('facilityPhone');
  const facilityLat=document.getElementById('facilityLat');
  const facilityLng=document.getElementById('facilityLng');
  const facilityRecommended=document.getElementById('facilityRecommended');

  const editing=!!facilityId.value.trim();
  let id=facilityId.value.trim();

  if(facilityLat.value==='' || facilityLng.value===''){
    await fillCoordinatesFromAddress();
  }
  if(facilityLat.value==='' || facilityLng.value===''){
    const fallback=fallbackCityPosition(facilityCity.value);
    if(fallback){
      facilityLat.value=fallback[0];
      facilityLng.value=fallback[1];
    }
  }

  const row={
    name:facilityName.value.trim(),
    area:facilityArea.value,
    city:facilityCity.value.trim(),
    address:facilityAddress.value.trim()||null,
    type:facilityType.value,
    url:facilityUrl.value.trim()||null,
    phone:facilityPhone.value.trim()||null,
    lat:facilityLat.value===''?null:Number(facilityLat.value),
    lng:facilityLng.value===''?null:Number(facilityLng.value),
    recommended:facilityRecommended.checked,
    is_active:true
  };

  if(!row.name){alert('施設名を入力してください');return}

  let result;
  if(editing){
    result=await sb.from('facilities').update(row).eq('id',id).select('*').single();
  }else{
    id='f-'+(crypto.randomUUID?crypto.randomUUID():Date.now());
    result=await sb.from('facilities').insert({id,...row}).select('*').single();
  }

  if(result.error){
    console.error(result.error);
    alert('保存できませんでした。Supabaseの権限設定を確認してください。');
    return
  }

  closeModal('facilityModal');
  await loadFacilities();
  const pos=getPos(result.data);
  if(pos&&map)map.setView(pos,14);
  renderMap();
  alert(editing?'施設情報を更新しました':'新しい施設を追加しました。地図にも表示しました');
}async function deleteFacility(id){
  if(!isAdmin){
    alert('管理者ログインが必要です');
    return;
  }

  const s=spots.find(x=>String(x.id)===String(id));
  if(!s)return;

  if(!confirm(`「${s.name}」を削除しますか？`))return;

  // 削除は is_active=false にする。
  // ここでは select() を付けない。
  // 削除直後の行は一般SELECTポリシーから見えなくなるため、
  // select() で確認すると「削除失敗」と誤判定するため。
  const {error}=await sb
    .from('facilities')
    .update({is_active:false})
    .eq('id',id);

  if(error){
    console.error('施設削除エラー',error);
    alert('削除できませんでした。\n\nSupabaseの管理者更新権限を確認してください。');
    return;
  }

  // 画面から即時除去
  spots=spots.filter(x=>String(x.id)!==String(id));
  renderSpots();

  // 公開一覧を再取得。削除済みは表示されない。
  await loadFacilities();

  if(spots.some(x=>String(x.id)===String(id))){
    alert('削除処理が反映されませんでした。\nSupabaseのUPDATEポリシーを確認してください。');
    return;
  }

  alert(`「${s.name}」を削除しました`);
}
async function init(){setupFilters();initMap();let {data}=await sb.auth.getSession();if(data.session){let {data:ok}=await sb.rpc('is_app_admin');isAdmin=!!ok}refreshAdmin();await loadFacilities();locateMe(true)}init();
</script></body></html>
