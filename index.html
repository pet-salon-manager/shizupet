</style></head><body><div class="app"><header class="hero"><h1>🐾 しずペットマップ</h1><p>静岡県のペット関連施設を、現在地からすぐ探せます。</p></header><section class="section"><div class="mapCard"><div class="mapHead"><h2>🗺️ 近くのペット施設</h2><button class="btn secondary" onclick="locateMe(false)">◎ 現在地</button></div><div id="map"></div></div><div style="height:14px"></div><button id="addFacilityBtn" class="btn adminAdd" style="margin-bottom:12px" onclick="adminTopAction()">🔐 管理者ログイン</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const SUPABASE_URL='https://abofyfovxysqzchstnbx.supabase.co';const SUPABASE_KEY='sb_publishable_pslo3qPFj50r2AQx_zx0ew_ywzBdxIj';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let spots=[],map,layer,currentMarker,currentPos,isAdmin=false,activeType='すべて';const types=['すべて','動物病院','トリミング','ペット用品','ドッグラン','ペット同伴','宿泊','その他'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safeUrl(u){try{let x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch{return '#'}}function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}function iconFor(t){return t==='動物病院'?'🏥':t==='トリミング'?'✂️':t==='ペット用品'?'🛍️':t==='ドッグラン'?'🐕':t==='宿泊'?'🏨':'📍'}
function initMap(){if(map||!window.L)return;map=L.map('map').setView([34.98,138.38],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map);setTimeout(()=>map.invalidateSize(),200)}function getPos(s){if(Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng)))return [Number(s.lat),Number(s.lng)];return null}function renderMap(){if(!map||!layer)return;layer.clearLayers();filtered().forEach(s=>{let p=getPos(s);if(!p)return;let m=L.marker(p).addTo(layer);m.bindPopup(`<strong>${esc(s.name)}</strong><br>${esc(s.city||'静岡県')}・${esc(s.type)}<br><button onclick="routeTo('${s.id}')">現在地から行く</button>`)})}
function locateMe(silent=false){if(!navigator.geolocation){if(!silent)alert('現在地を取得できません');return}navigator.geolocation.getCurrentPosition(pos=>{currentPos=[pos.coords.latitude,pos.coords.longitude];if(currentMarker)currentMarker.remove();let icon=L.divIcon({className:'',html:'<div class="currentDot"></div>',iconSize:[18,18],iconAnchor:[9,9]});currentMarker=L.marker(currentPos,{icon}).addTo(map).bindPopup('現在地');map.setView(currentPos,12);renderSpots()},()=>{if(!silent)alert('位置情報を許可してください')},{enableHighAccuracy:true,timeout:8000,maximumAge:120000})}
function distanceKm(a,b){if(!a||!b)return null;let R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b[0]-a[0]),dLon=toRad(b[1]-a[1]),x=Math.sin(dLat/2)**2+Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function couponActive(s){return !!(s&&s.coupon_enabled&&String(s.coupon_title||'').trim())}

async function trackEvent(facilityId,eventType){

}

async function openAnalytics(){
  if(!isAdmin)return;
  openModal('analyticsModal');
  analyticsBody.innerHTML='<div class="empty">読み込み中…</div>';
  let since=new Date(Date.now()-30*24*60*60*1000).toISOString();
  let {data,error}=await sb.from('facility_events').select('facility_id,event_type,created_at').gte('created_at',since);
  if(error){
    console.error(error);
    analyticsBody.innerHTML='<div class="empty">掲載実績を読み込めませんでした。SQL設定を確認してください。</div>';
    return;
  }
  let rows=data||[], counts={};
  for(let e of rows){
    let k=String(e.facility_id);
    counts[k]=counts[k]||{homepage:0,phone:0,route:0,coupon:0,total:0};
    if(counts[k][e.event_type]!==undefined)counts[k][e.event_type]++;
    counts[k].total++;
  }
  let total=rows.length;
  let hp=rows.filter(x=>x.event_type==='homepage').length;
  let phone=rows.filter(x=>x.event_type==='phone').length;
  let route=rows.filter(x=>x.event_type==='route').length;
  let coupon=rows.filter(x=>x.event_type==='coupon').length;

  let ranked=Object.entries(counts).sort((a,b)=>b[1].total-a[1].total).slice(0,20);
  analyticsBody.innerHTML=`<div class="statGrid">
    <div class="statBox"><span class="muted">総タップ</span><strong>${total}</strong></div>
    <div class="statBox"><span class="muted">公式HP</span><strong>${hp}</strong></div>
    <div class="statBox"><span class="muted">電話</span><strong>${phone}</strong></div>
    <div class="statBox"><span class="muted">経路</span><strong>${route}</strong></div>
    <div class="statBox"><span class="muted">クーポン</span><strong>${coupon}</strong></div>
  </div>
  <h3>店舗別</h3>
  <div class="analyticsList">${ranked.length?ranked.map(([id,c])=>{
    let s=spots.find(x=>String(x.id)===id);
    return `<div class="analyticsRow"><strong>${esc(s?.name||id)}</strong><div class="muted">合計 ${c.total}回 ｜ HP ${c.homepage} ｜ 電話 ${c.phone} ｜ 経路 ${c.route} ｜ クーポン ${c.coupon}</div></div>`
  }).join(''):'<div class="empty">まだ計測データがありません</div>'}</div>`;
}

}
function openFacebookSearch(){

  window.open(`https://www.facebook.com/search/top?q=${q}`,'_blank','noopener');
}
function openXSearch(){
  const q=encodeURIComponent(socialQuery());
  window.open(`https://x.com/search?q=${q}&src=typed_query&f=live`,'_blank','noopener');
}
function toggleHotFilter(){
  hotOnly=!hotOnly;
  hotFilterBtn.classList.toggle('active',hotOnly);
  renderSpots();
}

function filtered(){
  let q=(search.value||'').toLowerCase();
  let xs=spots.filter(s=>(!hotOnly||s.trending)&&(activeType==='すべて'||s.type===activeType)&&(`${s.name} ${s.city||''} ${s.type||''} ${s.address||''}`.toLowerCase().includes(q)));
  xs=xs.map(s=>({...s,_d:currentPos?distanceKm(currentPos,getPos(s)):null}));
  xs.sort((a,b)=>Number(!!b.sponsored)-Number(!!a.sponsored)||Number(!!b.trending)-Number(!!a.trending)||Number(!!b.recommended)-Number(!!a.recommended)||((a._d??9999)-(b._d??9999))||String(a.name||'').localeCompare(String(b.name||''),'ja'));
  return xs
}function setupFilters(){typeFilters.innerHTML=types.map(t=>`<button class="${activeType===t?'active':''}" onclick="activeType='${t}';setupFilters();renderSpots()">${t}</button>`).join('')}
function renderSpots(){
  let xs=filtered();
  count.textContent=`${xs.length}件`;
  spotList.innerHTML=xs.length?xs.map(s=>`<div class="card spot ${s.sponsored?'sponsorCard':(s.recommended?'recoCard':'')}"><div class="spotTop"><div class="icon">${iconFor(s.type)}</div><div style="flex:1">${s.sponsored?'<span class="prBadge">PR</span>':''}${s.trending?'<span class="hotBadge">🔥 話題</span>':''}${s.recommended?'<span class="recoBadge">⭐ おすすめ</span>':''}${couponActive(s)?'<span class="couponBadge">🎟️ クーポンあり</span>':''}<h3>${esc(s.name)}</h3><div class="muted">${esc(s.city||'静岡県')} ｜ ${esc(s.type)}</div>${s.address?`<div class="tag">📍 ${esc(s.address)}</div>`:''}${s._d!=null?`<div class="tag">現在地から直線距離 約${s._d.toFixed(s._d<10?1:0)}km</div>`:''}<div class="actions">${s.url?`<button onclick="openOfficial('${s.id}')">🌐 公式HP</button>`:''}${s.phone?`<button onclick="callFacility('${s.id}')">☎️ 電話</button>`:''}${couponActive(s)?`<button class="couponAction" onclick="openCoupon('${s.id}')">🎟️ クーポン</button>`:''}<button class="primary" onclick="routeTo('${s.id}')">🧭 経路</button>${isAdmin?`<button class="hotAdmin" onclick="toggleTrending('${s.id}')">${s.trending?'🔥 話題解除':'🔥 話題指定'}</button><button class="recommend" onclick="toggleRecommended('${s.id}')">${s.recommended?'⭐ おすすめ解除':'☆ おすすめ指定'}</button><button onclick="editFacility('${s.id}')">✏️ 編集</button><button class="danger" onclick="deleteFacility('${s.id}')">削除</button>`:''}</div></div></div></div>`).join(''):'<div class="card empty">条件に合う施設がありません</div>';
  renderMap()

async function loadFacilities(){
  let {data,error}=await sb
    .from('facilities')
    .select('*')
    .or('is_active.eq.true,is_active.is.null')
    .order('name');

  if(error){
    console.error(error);
    spotList.innerHTML='<div class="card empty">施設情報を読み込めませんでした</div>';
    return
  }

  spots=data||[];
  renderSpots()
}=await sb.from('facilities').select('*').eq('is_active',true).order('name');if(error){console.error(error);spotList.innerHTML='<div class="card empty">施設情報を読み込めませんでした</div>';return}spots=data||[];renderSpots()}function routeTo(id){
  let s=spots.find(x=>String(x.id)===String(id));if(!s)return;
  trackEvent(s.id,'route');
  let p=getPos(s),destination=s.address?encodeURIComponent(s.address):(p?`${p[0]},${p[1]}`:'');
  if(!destination)return alert('位置情報がありません');
  let open=o=>location.href=`https://maps.apple.com/?saddr=${o[0]},${o[1]}&daddr=${destination}&dirflg=d`;
  if(currentPos)open(currentPos);
  else navigator.geolocation.getCurrentPosition(pos=>open([pos.coords.latitude,pos.coords.longitude]),()=>alert('現在地を取得できません'))
}

function editFacility(id){
  let s=spots.find(x=>String(x.id)===String(id));if(!s)return;
  facilityTitle.textContent='施設情報を編集';
  facilityId.value=s.id;
  facilityName.value=s.name||'';
  facilityArea.value=s.area||'東部';
  facilityCity.value=s.city||'';
  facilityAddress.value=s.address||'';
  facilityType.value=s.type||'その他';
  facilityUrl.value=s.url||'';
  facilityPhone.value=s.phone||'';
  facilityLat.value=s.lat??'';
  facilityLng.value=s.lng??'';
  facilityRecommended.checked=!!s.recommended;
  facilityTrending.checked=!!s.trending;
  facilitySponsored.checked=!!s.sponsored;
  facilityCouponEnabled.checked=!!s.coupon_enabled;
  facilityCouponTitle.value=s.coupon_title||'';
  facilityCouponCode.value=s.coupon_code||'';
  facilityCouponTerms.value=s.coupon_terms||'';
  openModal('facilityModal')
}async function saveFacility(e){
  e.preventDefault();
  if(!isAdmin){alert('管理者ログインが必要です');return}

  const editing=!!facilityId.value.trim();
  let id=facilityId.value.trim();

  const row={
    name:facilityName.value.trim(),
    area:facilityArea.value,
    city:facilityCity.value.trim(),
    address:facilityAddress.value.trim()||null,
    type:facilityType.value,
    url:facilityUrl.value.trim()||null,
    phone:facilityPhone.value.trim()||null,
    lat:facilityLat.value===''?null:Number(facilityLat.value),
    lng:facilityLng.value===''?null:Number(facilityLng.value),
    recommended:facilityRecommended.checked,
    trending:facilityTrending.checked,
    sponsored:facilitySponsored.checked,
    coupon_enabled:facilityCouponEnabled.checked,
    coupon_title:facilityCouponTitle.value.trim()||null,
    coupon_code:facilityCouponCode.value.trim()||null,
    coupon_terms:facilityCouponTerms.value.trim()||null,
    is_active:true
  };

  if(!row.name){
    alert('施設名を入力してください');
    return
  }

  let result;
  if(editing){
    result=await sb.from('facilities').update(row).eq('id',id).select('*').single();
  }else{
    id='f-'+(crypto.randomUUID?crypto.randomUUID():Date.now());
    result=await sb.from('facilities').insert({id,...row}).select('*').single();
  }

  if(result.error||!result.data){
    console.error(result.error);
    alert('保存できませんでした。Supabaseの権限設定を確認してください。');
    return
  }

  closeModal('facilityModal');

  // 保存した施設をその場で表示
  const saved=result.data;
  const idx=spots.findIndex(s=>String(s.id)===String(saved.id));
  if(idx>=0)spots[idx]=saved;
  else spots.unshift(saved);

  activeType='すべて';
  hotOnly=false;
  if(typeof hotFilterBtn!=='undefined')hotFilterBtn.classList.remove('active');
  if(typeof search!=='undefined')search.value='';
  setupFilters();
  renderSpots();

  // Supabaseから再同期
  await loadFacilities();

  alert(editing?'施設情報を更新しました':'新しい施設を追加しました');
}
