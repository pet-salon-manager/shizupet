<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15342d"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>しずペットマップ</title><style>
:root{--bg:#f6f1e8;--card:#fffdf8;--text:#231f1a;--muted:#786f65;--pri:#15342d;--line:rgba(80,60,35,.14);--shadow:0 16px 40px rgba(40,30,20,.10)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#f8f3ea,#efe7da);color:var(--text)}button,input,select{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:30px}.hero{padding:calc(22px + env(safe-area-inset-top)) 20px 18px;background:linear-gradient(140deg,#10231f,#17352d 58%,#6d5b39);color:#fff7ea;border-radius:0 0 30px 30px}.hero h1{font-family:Georgia,"Yu Mincho",serif;font-size:30px;margin:4px 0 6px}.hero p{margin:0;color:#f3ead9}.section{padding:18px}.mapCard,.card{background:rgba(255,253,248,.95);border:1px solid rgba(255,255,255,.55);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.mapHead{display:flex;align-items:center;justify-content:space-between;padding:15px 16px}.mapHead h2{margin:0;font-family:Georgia,"Yu Mincho",serif;font-size:20px}#map{height:360px;background:#e8e1d5}.btn{border:0;border-radius:13px;padding:10px 13px;font-weight:800;background:linear-gradient(135deg,#15342d,#3f5e56);color:white}.btn.secondary{background:#f3e7cf;color:#5c4927}.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:white}.filters{display:flex;gap:8px;overflow:auto;padding:10px 0}.filters button{white-space:nowrap;border:1px solid var(--line);background:white;padding:9px 12px;border-radius:999px;color:#5f564b}.filters button.active{background:var(--pri);color:white;border-color:var(--pri)}.list{display:grid;gap:12px}.spot{padding:16px}.spotTop{display:flex;gap:12px}.icon{width:52px;height:52px;border-radius:16px;background:#f2e5c8;display:grid;place-items:center;font-size:25px;flex:none}.spot h3{margin:0 0 4px;font-size:18px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.tag{margin-top:6px;font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{border:1px solid var(--line);background:white;border-radius:11px;padding:8px 10px;color:#58482a}.actions .primary{background:var(--pri);color:white;border-color:var(--pri)}.actions .danger{background:#fff0ed;color:#8a342d;border-color:#efc9c2}.adminBox{margin-top:14px;padding:13px 15px;background:#f4ead7;border-radius:16px}.adminRow{display:flex;justify-content:space-between;align-items:center;gap:10px}.count{font-size:13px;color:var(--muted);margin:10px 2px}.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(20,20,20,.42);padding:18px;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:#fffdf9;border-radius:26px 26px 18px 18px;padding:18px}.sheetHead{display:flex;justify-content:space-between;align-items:center}.sheetHead h2{margin:0;font-family:Georgia,"Yu Mincho",serif}.sheetHead button{border:0;width:36px;height:36px;border-radius:50%;background:#f2e7d2}.form{display:grid;gap:10px;margin-top:14px}.form input,.form select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:white}.empty{padding:30px;text-align:center;color:var(--muted)}.currentDot{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid white;box-shadow:0 0 0 3px rgba(37,99,235,.24)}

.recoBadge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#f7e7b5,#d9b55b);color:#5b4314;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;margin-bottom:7px}
.recoCard{border:1px solid rgba(184,154,93,.45)!important;box-shadow:0 18px 42px rgba(184,154,93,.18)!important}
.actions .recommend{background:#fff7dc;color:#735414;border-color:#dfc16f;font-weight:800}
.adminAdd{width:100%;font-size:16px;padding:13px 15px;box-shadow:0 10px 24px rgba(21,52,45,.16)}

.recommendedFilter{background:#fff7dc!important;color:#735414!important;border-color:#dfc16f!important;font-weight:800}
.recommendedFilter.active{background:#8a6a20!important;color:white!important}
.recoBadge{display:inline-flex;align-items:center;background:#fff7dc;color:#735414;border:1px solid #dfc16f;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;margin:0 0 7px}
.recoCard{border:1px solid rgba(184,154,93,.5)!important;box-shadow:0 18px 38px rgba(184,154,93,.16)!important}
</style></head><body><div class="app"><header class="hero"><h1>🐾 しずペットマップ</h1><p>静岡県のペット関連施設を、現在地からすぐ探せます。</p></header><section class="section"><div class="mapCard"><div class="mapHead"><h2>🗺️ 近くのペット施設</h2><button class="btn secondary" onclick="locateMe(false)">◎ 現在地</button></div><div id="map"></div></div><div style="height:14px"></div><button id="addFacilityBtn" class="btn adminAdd" style="margin-bottom:12px" onclick="adminTopAction()">🔐 管理者ログイン</button>
  <input id="search" class="search" placeholder="施設名・市町・カテゴリで検索" oninput="renderSpots()"><div class="filters"><button id="recommendedFilterBtn" class="recommendedFilter" onclick="toggleRecommendedFilter()">⭐ おすすめ</button></div>
  <div id="typeFilters" class="filters"></div><div id="count" class="count"></div><div id="spotList" class="list"></div><div class="adminBox"><div class="adminRow"><div><strong id="adminStatus">管理者：未ログイン</strong><div class="muted">施設情報の追加・編集・削除は管理者のみ</div></div><button id="adminBtn" class="btn secondary" onclick="openAdmin()">ログイン</button></div></div></section></div>
<div id="adminModal" class="modal"><div class="sheet"><div class="sheetHead"><h2>管理者ログイン</h2><button onclick="closeModal('adminModal')">✕</button></div><form class="form" onsubmit="adminLogin(event)"><input id="adminEmail" type="email" placeholder="メールアドレス" required><input id="adminPassword" type="password" placeholder="パスワード" required><button class="btn">ログイン</button></form></div></div>
<div id="facilityModal" class="modal"><div class="sheet"><div class="sheetHead"><h2>施設情報を編集</h2><button onclick="closeModal('facilityModal')">✕</button></div><form class="form" onsubmit="saveFacility(event)"><input id="facilityId" type="hidden"><input id="facilityName" placeholder="施設名" required><select id="facilityArea"><option>東部</option><option>中部</option><option>西部</option><option>伊豆</option></select><input id="facilityCity" placeholder="市町"><input id="facilityAddress" placeholder="住所"><select id="facilityType"><option>動物病院</option><option>トリミング</option><option>ペット用品</option><option>ドッグラン</option><option>ペット同伴</option><option>宿泊</option><option>その他</option></select><input id="facilityUrl" type="url" placeholder="公式ホームページURL"><input id="facilityPhone" type="tel" placeholder="電話番号"><input id="facilityLat" type="number" step="any" placeholder="緯度"><input id="facilityLng" type="number" step="any" placeholder="経度"><label style="display:flex;align-items:center;gap:10px;padding:8px 2px;font-weight:700">
      <input id="facilityRecommended" type="checkbox" style="width:22px;height:22px">
      <span>⭐ おすすめのお店に設定する</span>
    </label>
    <button class="btn">保存</button></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const SUPABASE_URL='https://abofyfovxysqzchstnbx.supabase.co';const SUPABASE_KEY='sb_publishable_pslo3qPFj50r2AQx_zx0ew_ywzBdxIj';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let spots=[],map,layer,currentMarker,currentPos,isAdmin=false,activeType='すべて';const types=['すべて','動物病院','トリミング','ペット用品','ドッグラン','ペット同伴','宿泊','その他'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safeUrl(u){try{let x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch{return '#'}}function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}function iconFor(t){return t==='動物病院'?'🏥':t==='トリミング'?'✂️':t==='ペット用品'?'🛍️':t==='ドッグラン'?'🐕':t==='宿泊'?'🏨':'📍'}
function initMap(){if(map||!window.L)return;map=L.map('map').setView([34.98,138.38],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map);setTimeout(()=>map.invalidateSize(),200)}function getPos(s){if(Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng)))return [Number(s.lat),Number(s.lng)];return null}function renderMap(){if(!map||!layer)return;layer.clearLayers();filtered().forEach(s=>{let p=getPos(s);if(!p)return;let m=L.marker(p).addTo(layer);m.bindPopup(`<strong>${esc(s.name)}</strong><br>${esc(s.city||'静岡県')}・${esc(s.type)}<br><button onclick="routeTo('${s.id}')">現在地から行く</button>`)})}
function locateMe(silent=false){if(!navigator.geolocation){if(!silent)alert('現在地を取得できません');return}navigator.geolocation.getCurrentPosition(pos=>{currentPos=[pos.coords.latitude,pos.coords.longitude];if(currentMarker)currentMarker.remove();let icon=L.divIcon({className:'',html:'<div class="currentDot"></div>',iconSize:[18,18],iconAnchor:[9,9]});currentMarker=L.marker(currentPos,{icon}).addTo(map).bindPopup('現在地');map.setView(currentPos,12);renderSpots()},()=>{if(!silent)alert('位置情報を許可してください')},{enableHighAccuracy:true,timeout:8000,maximumAge:120000})}
function distanceKm(a,b){if(!a||!b)return null;let R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b[0]-a[0]),dLon=toRad(b[1]-a[1]),x=Math.sin(dLat/2)**2+Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function toggleRecommendedFilter(){
  recommendedOnly=!recommendedOnly;
  recommendedFilterBtn.classList.toggle('active',recommendedOnly);
  renderSpots();
}

function filtered(){
  let q=(search.value||'').toLowerCase();
  let xs=spots.filter(s =>
    (!recommendedOnly || s.recommended===true) &&
    (activeType==='すべて' || s.type===activeType) &&
    (`${s.name} ${s.city||''} ${s.type||''} ${s.address||''}`.toLowerCase().includes(q))
  );

  xs=xs.map(s=>({...s,_d:currentPos?distanceKm(currentPos,getPos(s)):null}));

  // おすすめを上位、その中では現在地に近い順
  xs.sort((a,b)=>
    Number(!!b.recommended)-Number(!!a.recommended) ||
    ((a._d??9999)-(b._d??9999)) ||
    String(a.name||'').localeCompare(String(b.name||''),'ja')
  );

  return xs;
}function setupFilters(){typeFilters.innerHTML=types.map(t=>`<button class="${activeType===t?'active':''}" onclick="activeType='${t}';setupFilters();renderSpots()">${t}</button>`).join('')}
function renderSpots(){let xs=filtered();count.textContent=`${xs.length}件`;spotList.innerHTML=xs.length?xs.map(s=>`<div class="card spot ${s.recommended?'recoCard':''}"><div class="spotTop"><div class="icon">${iconFor(s.type)}</div><div style="flex:1">${s.recommended?'<span class="recoBadge">⭐ おすすめ</span>':''}<h3>${esc(s.name)}</h3><div class="muted">${esc(s.city||'静岡県')} ｜ ${esc(s.type)}</div>${s.address?`<div class="tag">📍 ${esc(s.address)}</div>`:''}${s._d!=null?`<div class="tag">現在地から直線距離 約${s._d.toFixed(s._d<10?1:0)}km</div>`:''}<div class="actions">${s.url?`<button onclick="window.open('${safeUrl(s.url)}','_blank')">🌐 公式HP</button>`:''}${s.phone?`<button onclick="location.href='tel:${esc(s.phone)}'">☎️ 電話</button>`:''}<button class="primary" onclick="routeTo('${s.id}')">🧭 経路</button>${isAdmin?`<button class="recommend" onclick="toggleRecommended('${s.id}')">${s.recommended?'⭐ おすすめ解除':'☆ おすすめ指定'}</button><button onclick="editFacility('${s.id}')">✏️ 編集</button><button class="danger" onclick="deleteFacility('${s.id}')">削除</button>`:''}</div></div></div></div>`).join(''):'<div class="card empty">条件に合う施設がありません</div>';renderMap()}
async function loadFacilities(){
  let {data,error}=await sb.from('facilities').select('*').order('name');
  if(error){
    console.error(error);
    count.textContent='0件';
    spotList.innerHTML='<div class="card empty">施設情報を読み込めませんでした</div>';
    return
  }
  spots=(data||[]).filter(s=>s.is_active!==false);
  renderSpots()
}function routeTo(id){let s=spots.find(x=>String(x.id)===String(id));if(!s)return;let p=getPos(s),destination=s.address?encodeURIComponent(s.address):(p?`${p[0]},${p[1]}`:'');if(!destination)return alert('位置情報がありません');let open=o=>location.href=`https://maps.apple.com/?saddr=${o[0]},${o[1]}&daddr=${destination}&dirflg=d`;if(currentPos)open(currentPos);else navigator.geolocation.getCurrentPosition(pos=>open([pos.coords.latitude,pos.coords.longitude]),()=>alert('現在地を取得できません'))}
function adminTopAction(){
  if(isAdmin)newFacility();
  else openAdmin();
}
async function openAdmin(){if(isAdmin){if(confirm('ログアウトしますか？')){await sb.auth.signOut();isAdmin=false;refreshAdmin();renderSpots()}return}openModal('adminModal')}async function adminLogin(e){e.preventDefault();let {data,error}=await sb.auth.signInWithPassword({email:adminEmail.value,password:adminPassword.value});if(error)return alert('ログインできませんでした');let {data:ok}=await sb.rpc('is_app_admin');isAdmin=!!ok;if(!isAdmin){await sb.auth.signOut();return alert('管理者権限がありません')}closeModal('adminModal');refreshAdmin();renderSpots()}function refreshAdmin(){
  adminStatus.textContent=isAdmin?'管理者：ログイン中':'管理者：未ログイン';
  adminBtn.textContent=isAdmin?'ログアウト':'ログイン';
  addFacilityBtn.textContent=isAdmin?'＋ 新しい施設を追加':'🔐 管理者ログイン';
  addFacilityBtn.classList.toggle('secondary',!isAdmin);
}
function newFacility(){
  if(!isAdmin)return;
  facilityTitle.textContent='新しい施設を追加';
  facilityId.value='';
  facilityName.value='';
  facilityArea.value='東部';
  facilityCity.value='';
  facilityAddress.value='';
  facilityType.value='動物病院';
  facilityUrl.value='';
  facilityPhone.value='';
  facilityLat.value='';
  facilityLng.value='';
  facilityRecommended.checked=false;
  openModal('facilityModal')
}

async function toggleRecommended(id){
  if(!isAdmin)return;
  let s=spots.find(x=>String(x.id)===String(id));if(!s)return;
  let {error}=await sb.from('facilities').update({recommended:!s.recommended}).eq('id',id);
  if(error){alert('おすすめ設定を変更できませんでした');return}
  await loadFacilities()
}

function editFacility(id){
  let s=spots.find(x=>String(x.id)===String(id));if(!s)return;
  facilityTitle.textContent='施設情報を編集';
  facilityId.value=s.id;
  facilityName.value=s.name||'';
  facilityArea.value=s.area||'東部';
  facilityCity.value=s.city||'';
  facilityAddress.value=s.address||'';
  facilityType.value=s.type||'その他';
  facilityUrl.value=s.url||'';
  facilityPhone.value=s.phone||'';
  facilityLat.value=s.lat??'';
  facilityLng.value=s.lng??'';
  facilityRecommended.checked=!!s.recommended;
  openModal('facilityModal')
}async function saveFacility(e){
  e.preventDefault();
  if(!isAdmin){alert('管理者ログインが必要です');return}

  const editing=!!facilityId.value.trim();
  let id=facilityId.value.trim();

  const row={
    name:facilityName.value.trim(),
    area:facilityArea.value,
    city:facilityCity.value.trim(),
    address:facilityAddress.value.trim()||null,
    type:facilityType.value,
    url:facilityUrl.value.trim()||null,
    phone:facilityPhone.value.trim()||null,
    lat:facilityLat.value===''?null:Number(facilityLat.value),
    lng:facilityLng.value===''?null:Number(facilityLng.value),
    recommended:facilityRecommended.checked,
    is_active:true
  };

  if(!row.name){alert('施設名を入力してください');return}

  let result;
  if(editing){
    result=await sb.from('facilities').update(row).eq('id',id).select('*').single();
  }else{
    id='f-'+(crypto.randomUUID?crypto.randomUUID():Date.now());
    result=await sb.from('facilities').insert({id,...row}).select('*').single();
  }

  if(result.error){
    console.error(result.error);
    alert('保存できませんでした。Supabaseの権限設定を確認してください。');
    return
  }

  closeModal('facilityModal');
  await loadFacilities();
  alert(editing?'施設情報を更新しました':'新しい施設を追加しました');
}async function deleteFacility(id){
  if(!isAdmin){
    alert('管理者ログインが必要です');
    return;
  }

  const s=spots.find(x=>String(x.id)===String(id));
  if(!s)return;

  if(!confirm(`「${s.name}」を削除しますか？`))return;

  // 削除は is_active=false にする。
  // ここでは select() を付けない。
  // 削除直後の行は一般SELECTポリシーから見えなくなるため、
  // select() で確認すると「削除失敗」と誤判定するため。
  const {error}=await sb
    .from('facilities')
    .update({is_active:false})
    .eq('id',id);

  if(error){
    console.error('施設削除エラー',error);
    alert('削除できませんでした。\n\nSupabaseの管理者更新権限を確認してください。');
    return;
  }

  // 画面から即時除去
  spots=spots.filter(x=>String(x.id)!==String(id));
  renderSpots();

  // 公開一覧を再取得。削除済みは表示されない。
  await loadFacilities();

  if(spots.some(x=>String(x.id)===String(id))){
    alert('削除処理が反映されませんでした。\nSupabaseのUPDATEポリシーを確認してください。');
    return;
  }

  alert(`「${s.name}」を削除しました`);
}
async function init(){setupFilters();initMap();let {data}=await sb.auth.getSession();if(data.session){let {data:ok}=await sb.rpc('is_app_admin');isAdmin=!!ok}refreshAdmin();await loadFacilities();locateMe(true)}init();
</script></body></html>
